<title>11월 넷째 주 수업 큐시트</title><meta name="claude:viewport-fit-sides" content="cover"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<style id="app-css">
/* 무대 감독 큐시트: 위에 저장 상태와 날짜별 진행, 아래로 날짜 칸이 이어지고 줄마다 시각 태그 + 할 일 + 체크 */
:root{--bg:#f3f5f8;--card:#ffffff;--ink:#17202b;--sub:#5d6876;--line:#dfe4ea;--accent:#1d5fd6;--accent-soft:#e7efff;--cue:#9a4a00;--cue-soft:#fdf0d8;--done:#1f7a4d;--done-soft:#e3f4ea;--warn:#8a5a00;--warn-soft:#fff4d6;
--ui:'IBM Plex Sans KR',-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;--mono:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#111418;--card:#1a1e24;--ink:#e8ebef;--sub:#a3acb8;--line:#2c323b;--accent:#78a6ff;--accent-soft:#1c2a44;--cue:#f2b25c;--cue-soft:#3a2a12;--done:#6fd19e;--done-soft:#163324;--warn:#f1c45a;--warn-soft:#3a3013;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#111418;--card:#1a1e24;--ink:#e8ebef;--sub:#a3acb8;--line:#2c323b;--accent:#78a6ff;--accent-soft:#1c2a44;--cue:#f2b25c;--cue-soft:#3a2a12;--done:#6fd19e;--done-soft:#163324;--warn:#f1c45a;--warn-soft:#3a3013;color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--ui);font-size:17px;line-height:1.6;word-break:keep-all;overflow-wrap:break-word;padding-block:20px 64px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
main{max-width:760px;margin:0 auto;display:grid;gap:18px}
header{display:grid;gap:10px}
.eyebrow{font-family:var(--mono);font-size:13px;font-weight:600;letter-spacing:.06em;color:var(--sub)}
h1{font-size:clamp(26px,6vw,36px);line-height:1.25;margin:0;font-weight:700;text-wrap:balance}
.lead{margin:0;color:var(--sub);font-size:16px}
.status{display:flex;align-items:baseline;gap:8px;font-size:14px;color:var(--sub)}
.status span:last-child{min-width:0}
.dot{width:9px;height:9px;border-radius:50%;background:var(--sub);flex:none;transform:translateY(-1px)}
.status[data-s="shared"] .dot{background:var(--done)}
.status[data-s="soon"] .dot,.status[data-s="saving"] .dot{background:var(--cue)}
.status[data-s="local"] .dot{background:var(--warn)}
.banner{display:flex;flex-wrap:wrap;align-items:center;gap:10px;background:var(--warn-soft);color:var(--ink);border-radius:12px;padding:12px 14px;font-size:15px}
.days{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.days::-webkit-scrollbar{display:none}
.daychip{flex:none;display:grid;gap:2px;text-align:left;font:inherit;font-size:13px;line-height:1.3;padding:8px 12px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer;min-width:84px}
.daychip b{font-size:14px}
.daychip .n{font-family:var(--mono);font-variant-numeric:tabular-nums;color:var(--sub)}
.daychip.today{border-color:var(--accent);background:var(--accent-soft)}
.daychip.all .n{color:var(--done)}
.links{background:var(--card);border-radius:16px;padding:14px 16px;display:grid;gap:6px}
.links h2,.day h2{font-size:15px;margin:0 0 4px;color:var(--sub);font-weight:600;letter-spacing:.02em}
.linkrow{display:grid;grid-template-columns:minmax(0,7.5em) minmax(0,1fr);gap:8px;align-items:baseline;font-size:15px;padding:6px 0;border-top:1px solid var(--line)}
.linkrow:first-of-type{border-top:0}
.linkrow span{color:var(--sub);font-family:var(--mono);font-size:13px}
.linkrow a{color:var(--accent);font-weight:600;text-decoration:none;overflow-wrap:anywhere}
.linkrow a:hover{text-decoration:underline}
.note{font-size:13px;color:var(--sub);margin:4px 0 0}
details.day{background:var(--card);border-radius:16px;overflow:hidden}
details.day>summary{list-style:none;cursor:pointer;padding:14px 16px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;align-items:center}
details.day>summary::-webkit-details-marker{display:none}
.sumtitle{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 8px;min-width:0}
.sumtitle b{font-size:18px}
.sumtitle small{color:var(--sub);font-size:14px}
.badge{font-size:12px;font-weight:700;border-radius:999px;padding:2px 8px;background:var(--accent-soft);color:var(--accent)}
.count{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:14px;color:var(--sub);white-space:nowrap}
.count.all{color:var(--done)}
.bar{grid-column:1/-1;height:4px;border-radius:2px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--done);width:0;transition:width .25s}
@media (prefers-reduced-motion:reduce){.bar i{transition:none}}
.items{list-style:none;margin:0;padding:0 8px 10px;display:grid;gap:2px}
.item{display:grid;grid-template-columns:28px minmax(0,1fr);gap:10px;padding:10px 8px;border-radius:10px;align-items:start}
.item:hover{background:var(--bg)}
.item input{width:22px;height:22px;margin:2px 0 0;accent-color:var(--done);cursor:pointer}
.item label{cursor:pointer;display:grid;gap:4px;min-width:0}
.item .t{font-family:var(--mono);font-size:12.5px;font-weight:600;color:var(--cue);background:var(--cue-soft);border-radius:6px;padding:1px 7px;justify-self:start}
.item .x{font-size:16px}
.item.done .x{color:var(--sub);text-decoration:line-through;text-decoration-color:var(--line)}
.item .more{font-size:14px;color:var(--sub)}
.item a{color:var(--accent);font-weight:600;font-size:14px;text-decoration:none;overflow-wrap:anywhere}
.quote{font-size:14.5px;line-height:1.6;background:var(--bg);border-radius:10px;padding:10px 12px;margin:2px 0 0;white-space:pre-wrap;user-select:text}
.btn{font:inherit;font-size:14px;font-weight:600;border:0;border-radius:10px;padding:7px 12px;background:var(--accent);color:#fff;cursor:pointer;justify-self:start}
.btn.ghost{background:var(--accent-soft);color:var(--accent)}
.daynote{margin:0 16px 12px;font-size:14px;color:var(--sub)}
button:focus-visible,a:focus-visible,input:focus-visible,summary:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
footer{font-size:13px;color:var(--sub)}
</style>

    if(s.id===todayId||(!todayId&&s.id==='ev'))det.open=true;
    var cnt=el('span',{cls:'count'});var bar=el('i');
    var title=el('div',{cls:'sumtitle'},[el('b',{text:s.label+' · '+s.name}),el('small',{text:s.theme})]);
    if(s.id===todayId)title.appendChild(el('span',{cls:'badge',text:'오늘'}));
    det.appendChild(el('summary',null,[title,cnt,el('div',{cls:'bar'},[bar])]));
    if(s.note)det.appendChild(el('p',{cls:'daynote',text:s.note}));
    var ul=el('ul',{cls:'items'});
    s.items.forEach(function(it){ul.appendChild(item(it));});
    det.appendChild(ul);
    secEls[s.id]={det:det,cnt:cnt,bar:bar};
    return det;
  }
  function item(it){
    var li=el('li',{cls:'item'+(state.checked[it.id]?' done':'')});
    var cb=el('input',{type:'checkbox',id:'c-'+it.id});cb.checked=!!state.checked[it.id];
    cb.addEventListener('change',function(){toggle(it.id,cb.checked,li);});
    var lab=el('label',{'for':'c-'+it.id},[it.t?el('span',{cls:'t',text:it.t}):null,el('span',{cls:'x',text:it.x}),it.more?el('span',{cls:'more',text:it.more}):null]);
    var body=el('div',{style:'display:grid;gap:6px;min-width:0'},[lab]);
    if(it.links){var row=el('div',{style:'display:flex;flex-wrap:wrap;gap:6px 14px'});it.links.forEach(function(l){row.appendChild(link(l[0]+' 열기',l[1]));});body.appendChild(row);}
    if(it.quote){var q=el('p',{cls:'quote',text:it.quote});var b=el('button',{cls:'btn ghost',type:'button',text:'단톡방 글 복사'});
      b.addEventListener('click',function(){copy(it.quote,q,b);});body.appendChild(q);body.appendChild(b);}
    li.appendChild(cb);li.appendChild(body);return li;
  }
  function copy(text,q,b){
    function sel(){try{var r=document.createRange();r.selectNodeContents(q);var s=window.getSelection();s.removeAllRanges();s.addRange(r);}catch(e){}b.textContent='글을 골라 두었어요 · 복사해서 붙여요';}
    try{navigator.clipboard.writeText(text).then(function(){b.textContent='복사됐어요';setTimeout(function(){b.textContent='단톡방 글 복사';},2000);},sel);}catch(e){sel();}
  }
  function refresh(){
    var chips=[];
    DATA.sections.forEach(function(s){var c=count(s),e=secEls[s.id];e.cnt.textContent=c[0]+'/'+c[1];e.cnt.className='count'+(c[0]===c[1]?' all':'');e.bar.style.width=(c[1]?Math.round(c[0]/c[1]*100):0)+'%';
      var chip=el('button',{type:'button',cls:'daychip'+(s.id===todayId?' today':'')+(c[0]===c[1]?' all':'')},[el('b',{text:s.label}),el('span',{cls:'n',text:c[0]+'/'+c[1]})]);
      chip.addEventListener('click',function(){e.det.open=true;e.det.scrollIntoView({block:'start'});});chips.push(chip);});
    chipBox.textContent='';chips.forEach(function(c){chipBox.appendChild(c);});
  }
  function showBanner(){
    if(!pending){bannerEl.hidden=true;return;}
    bannerEl.textContent='';bannerEl.hidden=false;
    bannerEl.appendChild(el('span',{text:'저장되지 않은 체크가 있어요(다른 화면에서 먼저 저장했을 때 생겨요).'}));
    var b=el('button',{cls:'btn',type:'button',text:'내 체크로 저장'});
    b.addEventListener('click',function(){state.checked=pending.checked;pending=null;bannerEl.hidden=true;rerenderChecks();changed();});
    bannerEl.appendChild(b);
  }
  function rerenderChecks(){DATA.sections.forEach(function(s){s.items.forEach(function(it){var cb=document.getElementById('c-'+it.id);if(cb){cb.checked=!!state.checked[it.id];cb.closest('.item').classList.toggle('done',cb.checked);}});});refresh();}
  function toggle(id,on,li){if(on)state.checked[id]=true;else delete state.checked[id];li.classList.toggle('done',on);refresh();changed();}
  function changed(){
    if(mode==='local'){wr('l',LKEY,state.checked);return;}
    if(mode==='wait'){queued=true;setStatus('soon','저장 연결이 되면 바로 저장해요');return;}
    wr('s',PKEY,{checked:state.checked});
    clearTimeout(timer);setStatus('soon','곧 저장해요…');timer=setTimeout(save,2500);
  }
  function goLocal(msg){mode='local';wr('l',LKEY,state.checked);setStatus('local',msg||'이 화면에서는 체크가 이 기기에만 남아요');}
  function save(){
    if(!art){goLocal();return;}
    setStatus('saving','저장 중… 저장되면 화면을 새로 불러와요');
    state.saved=new Date().toISOString();
    art.publish(buildDoc()).then(function(){rm('s',PKEY);}).catch(function(err){
      var c=err&&err.code;
      if(c==='conflict'){setStatus('soon','다른 화면에서 먼저 저장해서 새로 불러와요');return;}
      if(c==='rate_limited'){setStatus('soon','잠시 뒤에 다시 저장해요');clearTimeout(timer);timer=setTimeout(save,12000);return;}
      if(c==='upstream_error'&&!retried){retried=true;clearTimeout(timer);timer=setTimeout(save,2000+Math.random()*2000);return;}
      if(c==='too_large'||c==='invalid_content'||c==='transform_error'){goLocal('저장하지 못해서 이 기기에만 남겼어요');return;}
      goLocal('이 화면은 읽기 전용이라 체크가 이 기기에만 남아요');
    });
  }
  function esc(s){return String(s).replace(/</g,'\\u003c');}
  function buildDoc(){
    var css=document.getElementById('app-css').textContent;
    var data=document.getElementById('data').textContent;
    var js=document.getElementById('app-js').textContent;
    var st=esc(JSON.stringify({checked:state.checked,saved:state.saved}));
    var E='</'+'script>';
    return '<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>'+RESET+'</style></head><body>'+
      HEAD+'\n<style id="app-css">'+css+'</style>\n<main id="app"></main>\n<script type="application/json" id="data">'+data+E+'\n<script type="application/json" id="state">'+st+E+'\n<script id="app-js">'+js+E+'\n</body></html>';
  }
  build();refresh();idleStatus();showBanner();
  var usePromise=(window.claude&&typeof window.claude.use==='function')?window.claude.use('artifact'):Promise.resolve(null);
  Promise.resolve(usePromise).then(function(a){
    art=a;
    if(!a){var loc=rd('l',LKEY);if(loc){state.checked=loc;rerenderChecks();}mode='local';idleStatus();return;}
    mode='shared';idleStatus();if(queued){queued=false;changed();}
  },function(){mode='local';idleStatus();});
})();
</script>
