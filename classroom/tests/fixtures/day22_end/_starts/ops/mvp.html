<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>출결·문의 현황</title>
<style>
  :root { --bg:#f6f7f9; --card:#ffffff; --ink:#1d2330; --sub:#5b6474; --line:#e3e6eb; --blue:#2f5bea; --blue-soft:#e8eefe; --red:#c4372d; --red-soft:#fdecea; --amber:#9a6200; --amber-soft:#fff4dc; --green:#1f7a4d; }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body { margin:0; background:var(--bg); color:var(--ink); font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", sans-serif; }
  .wrap { max-width: 760px; margin: 0 auto; padding: 14px 16px 40px; }
  .tag { display:inline-block; font-size:12px; font-weight:700; color:var(--amber); background:var(--amber-soft); border:1px solid #f0d9a6; border-radius:999px; padding:3px 10px; }
  h1 { font-size: 21px; line-height:1.35; margin: 10px 0 2px; word-break: keep-all; }
  .base { color: var(--sub); font-size: 13px; margin: 0 0 14px; }
  h2 { font-size: 16px; margin: 22px 0 8px; }
  .tiles { display:grid; grid-template-columns: 1fr 1fr; gap:10px; }
  .tile { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:12px 14px; min-width:0; }
  .tile .k { font-size:13px; color:var(--sub); }
  .tile .v { font-size:30px; font-weight:800; line-height:1.15; margin-top:2px; }
  .tile .v small { font-size:15px; font-weight:700; margin-left:2px; }
  .tile.abs .v { color: var(--red); }
  .tile.open .v { color: var(--amber); }
  .tile .d { font-size:12px; color:var(--sub); margin-top:4px; word-break: keep-all; }
  .week { margin:10px 0 0; font-size:13px; color:var(--sub); background:var(--card); border:1px dashed var(--line); border-radius:10px; padding:8px 12px; }
  .filters { display:flex; flex-wrap:wrap; gap:6px; }
  .filters button { font: inherit; font-size:14px; border:1px solid var(--line); background:var(--card); color:var(--ink); border-radius:999px; padding:6px 13px; cursor:pointer; }
  .filters button[aria-pressed="true"] { background:var(--blue); border-color:var(--blue); color:#fff; font-weight:700; }
  .count { font-size:13px; color:var(--sub); margin:8px 0 6px; }
  table { width:100%; border-collapse:collapse; table-layout:fixed; background:var(--card); border:1px solid var(--line); border-radius:12px; overflow:hidden; font-size:13px; }
  th, td { padding:7px 5px; border-bottom:1px solid var(--line); text-align:left; vertical-align:top; overflow-wrap:anywhere; }
  th { background:#eef1f5; font-size:12px; color:var(--sub); font-weight:700; }
  col.c-date { width: 46px; } col.c-name { width: 48px; } col.c-kind { width: 38px; } col.c-state { width: 76px; }
  td .wd { display:block; font-size:11px; color:var(--sub); }
  .pill { display:inline-block; font-size:11.5px; border-radius:6px; padding:1px 5px; white-space:nowrap; }
  .pill.done { color:var(--green); background:#e6f4ec; }
  .pill.todo { color:var(--red); background:var(--red-soft); font-weight:700; }
  tr.is-abs td.what { color:var(--red); font-weight:700; }
  tr.is-late td.what { color:var(--amber); }
  .src { margin-top:14px; font-size:12px; color:var(--sub); line-height:1.6; }
</style>
</head>
<body>
<div class="wrap">
  <span class="tag">가상 회사 · 가명 예시 데이터</span>
  <h1>예시 교육센터(가상) · 출결·문의 현황</h1>
  <p class="base" id="base"></p>

  <h2>오늘 요약</h2>
  <div class="tiles">
    <div class="tile abs"><div class="k">결석</div><div class="v" id="absN"></div><div class="d" id="absD"></div></div>
    <div class="tile open"><div class="k">미처리 문의</div><div class="v" id="openN"></div><div class="d" id="openD"></div></div>
  </div>
  <p class="week" id="week"></p>

  <h2>구분별로 보기</h2>
  <div class="filters" id="filters">
    <button type="button" data-f="all" aria-pressed="true">전체</button>
    <button type="button" data-f="출결" aria-pressed="false">출결</button>
    <button type="button" data-f="문의" aria-pressed="false">문의</button>
    <button type="button" data-f="결석" aria-pressed="false">결석만</button>
    <button type="button" data-f="미처리" aria-pressed="false">미처리 문의</button>
  </div>
  <p class="count" id="count"></p>
  <table>
    <colgroup><col class="c-date"><col class="c-name"><col class="c-kind"><col><col class="c-state"></colgroup>
    <thead><tr><th>날짜</th><th>이름</th><th>구분</th><th>내용</th><th>상태</th></tr></thead>
    <tbody id="rows"></tbody>
  </table>
  <p class="src">출처: 구글 시트 내려받기(예시). 모든 줄이 같은 시트에서 왔어요(records.csv와 같은 기록).<br>가상 회사의 가명 예시 데이터라 실제 사람·실제 출결이 아니에요. 화면의 숫자는 모두 아래 기록을 센 값이에요.</p>
</div>
<script>
// 예시 데이터: [날짜, 이름, 구분, 내용, 상태] · 출처는 모두 "구글 시트 내려받기(예시)"
const RECORDS = [

  ["2026-11-11","가명1","문의","수업 자료: 3회차 프롬프트 예시 요청","처리 완료"],
  ["2026-11-12","가명1","출결","출석","처리 완료"],
  ["2026-11-12","가명2","출결","출석","처리 완료"],

  ["2026-11-13","가명8","문의","수업 자료: 4회차 녹화본 요청","처리 완료"],
  ["2026-11-13","가명2","문의","기타: 영수증 다시 발급 요청","처리 완료"],

  ["2026-11-16","가명1","문의","수업 자료: 5회차 실습 파일 다시 요청","처리 완료"],

  ["2026-11-18","가명7","문의","수업 자료: 6회차 녹화본 요청","처리 완료"],
  ["2026-11-19","가명1","출결","출석","처리 완료"],

  ["2026-11-20","가명2","문의","수업 자료: 녹화본 링크가 열리지 않음","처리 완료"],
  ["2026-11-20","가명6","문의","환불: 환불 처리 진행 상황 다시 문의","미처리"],
  ["2026-11-21","가명5","문의","수강 변경: 남은 수업 연기 요청","미처리"],
  ["2026-11-21","가명4","문의","기타: 마지막 주 수업 시간 변경 여부 문의","처리 완료"]
];
const WD = ['일','월','화','수','목','금','토'];
function md(d) { return d.slice(5).replace('-', '/'); }
function wd(d) { return WD[new Date(d + 'T00:00:00').getDay()]; }
function kind(r) { return r[3].split(':')[0]; }

const base = RECORDS.reduce((m, r) => r[0] > m ? r[0] : m, RECORDS[0][0]);
const lastClass = RECORDS.filter(r => r[2] === '출결').reduce((m, r) => r[0] > m ? r[0] : m, '');
const absToday = RECORDS.filter(r => r[0] === lastClass && kind(r) === '결석');
const open = RECORDS.filter(r => r[2] === '문의' && r[4] === '미처리');
const weekStart = (() => { const t = new Date(base + 'T00:00:00'); t.setDate(t.getDate() - 6); const p = n => String(n).padStart(2, '0'); return t.getFullYear() + '-' + p(t.getMonth() + 1) + '-' + p(t.getDate()); })();
const inWeek = RECORDS.filter(r => r[0] >= weekStart && r[0] <= base);

document.getElementById('base').textContent = '기준일 ' + base + '(' + wd(base) + ') · 예시 데이터의 마지막 기록일 · 기록 ' + RECORDS.length + '줄';
document.getElementById('absN').innerHTML = absToday.length + '<small>명</small>';
document.getElementById('absD').textContent = '최근 수업 ' + md(lastClass) + '(' + wd(lastClass) + ') · ' + absToday.map(r => r[1]).join(', ');
document.getElementById('openN').innerHTML = open.length + '<small>건</small>';
document.getElementById('openD').textContent = '가장 오래된 것 ' + md(open.map(r => r[0]).sort()[0]) + ' · 아직 답하지 않은 문의';
document.getElementById('week').textContent = '최근 7일(' + md(weekStart) + '~' + md(base) + '): 결석 ' + inWeek.filter(r => kind(r) === '결석').length + '건 · 지각 ' + inWeek.filter(r => kind(r) === '지각').length + '건 · 문의 ' + inWeek.filter(r => r[2] === '문의').length + '건';

const pass = {
  all: () => true,
  '출결': r => r[2] === '출결',
  '문의': r => r[2] === '문의',
  '결석': r => kind(r) === '결석',
  '미처리': r => r[2] === '문의' && r[4] === '미처리'
};
function esc(s) { return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }
function show(f) {
  const list = RECORDS.filter(pass[f]).slice().reverse();
  document.getElementById('rows').innerHTML = list.map(r => {
    const k = kind(r);
    const cls = k === '결석' ? 'is-abs' : (k === '지각' ? 'is-late' : '');
    const st = r[4] === '미처리' ? '<span class="pill todo">미처리</span>' : '<span class="pill done">처리 완료</span>';
    return '<tr class="' + cls + '"><td>' + md(r[0]) + '<span class="wd">' + wd(r[0]) + '</span></td><td>' + esc(r[1]) + '</td><td>' + esc(r[2]) + '</td><td class="what">' + esc(r[3]) + '</td><td>' + st + '</td></tr>';
  }).join('');
  document.getElementById('count').textContent = '전체 ' + RECORDS.length + '줄 중 ' + list.length + '줄 · 최근 날짜부터';
  document.querySelectorAll('#filters button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.f === f)));
}
document.getElementById('filters').addEventListener('click', e => {
  const b = e.target.closest('button');
  if (b) show(b.dataset.f);
});
show('all');
</script>
</body>
</html>
