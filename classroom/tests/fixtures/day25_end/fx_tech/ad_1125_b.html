<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>컬리 시안 B</title>
<style>
html,body{margin:0;padding:0;background:#111;overflow:hidden}

.board{position:relative;width:min(100vw,1080px);aspect-ratio:4/5;margin:0 auto;overflow:hidden;container-type:inline-size;
 font-family:"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR","WenQuanYi Zen Hei",sans-serif;word-break:keep-all;background:#222}
.bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.shade{position:absolute;left:0;right:0;bottom:0;height:62%;background:linear-gradient(to top,rgba(255,250,246,.95) 0%,rgba(255,250,246,.7) 45%,rgba(0,0,0,0) 100%)}
.copy{position:absolute;left:7.4cqw;right:7.4cqw;bottom:9cqw;color:#1f1530}
.brand{font-size:3.6cqw;font-weight:800;letter-spacing:-.02em;margin:0 0 3cqw}
.eyebrow{display:inline-block;font-size:2.8cqw;font-weight:700;padding:1cqw 2.4cqw;border-radius:99cqw;background:#5f0080;color:#fff;margin:0 0 2.6cqw}
h1{font-size:8.6cqw;line-height:1.18;font-weight:900;letter-spacing:-.03em;margin:0 0 2.6cqw;text-shadow:none}
p{font-size:3.5cqw;line-height:1.45;font-weight:500;margin:0 0 4.4cqw;opacity:.95}
.btn{display:inline-block;font-size:3.4cqw;font-weight:800;padding:2.2cqw 5cqw;border-radius:99cqw;background:#5f0080;color:#fff}
.ph{display:inline-block;border:.35cqw dashed currentColor;border-radius:1.2cqw;padding:0 1.4cqw;font-size:.62em;vertical-align:.12em;line-height:1.5}
p .ph{font-size:.9em;vertical-align:0}
.items{position:absolute;left:7.4cqw;right:7.4cqw;top:29cqw;display:flex;flex-wrap:wrap;gap:1.6cqw}
.items span{font-size:3cqw;font-weight:700;padding:1.2cqw 2.8cqw;border-radius:99cqw;background:rgba(20,10,40,.72);color:#fff;backdrop-filter:blur(4px)}
.btop{position:absolute;left:7.4cqw;right:7.4cqw;top:9cqw;color:#1f1530}
.top{position:absolute;left:7.4cqw;right:7.4cqw;top:9cqw;font-size:6.4cqw;line-height:1.25;font-weight:900;letter-spacing:-.03em;color:#4a1f5c}
.tag{position:absolute;right:2.6cqw;bottom:2cqw;font-size:2cqw;color:rgba(31,21,48,.75);font-weight:600}

<body><div class="board">
<img class="bg" src="bg_1125_b.png" alt="">
<div class="shade"></div>
<div class="btop"><div class="brand">컬리</div><div class="eyebrow">새벽배송 신선식품</div></div><div class="copy">

<h1>장 보는 시간은 빼고</h1>
<p>밤에 주문한 신선식품을 아침에 받고,<br>퇴근 뒤 시간은 가족과 보내세요.</p>

</div>
