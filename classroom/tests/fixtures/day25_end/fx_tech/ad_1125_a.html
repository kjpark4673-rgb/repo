<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>컬리 시안 A</title>
<style>
html,body{margin:0;padding:0;background:#111;overflow:hidden}
body::-webkit-scrollbar{display:none}
.board{position:relative;width:min(100vw,1080px);aspect-ratio:4/5;margin:0 auto;overflow:hidden;container-type:inline-size;
 font-family:"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR","WenQuanYi Zen Hei",sans-serif;word-break:keep-all;background:#222}
.bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.shade{position:absolute;left:0;right:0;top:0;height:62%;background:linear-gradient(to bottom,rgba(10,8,30,.82) 0%,rgba(10,8,30,.55) 45%,rgba(0,0,0,0) 100%)}
.copy{position:absolute;left:7.4cqw;right:7.4cqw;top:9cqw;color:#fff}
.brand{font-size:3.6cqw;font-weight:800;letter-spacing:-.02em;margin:0 0 3cqw}
.eyebrow{display:inline-block;font-size:2.8cqw;font-weight:700;padding:1cqw 2.4cqw;border-radius:99cqw;background:rgba(255,255,255,.18);color:#fff;margin:0 0 2.6cqw}
h1{font-size:8.6cqw;line-height:1.18;font-weight:900;letter-spacing:-.03em;margin:0 0 2.6cqw;text-shadow:0 .3cqw 1.2cqw rgba(0,0,0,.35)}
p{font-size:3.5cqw;line-height:1.45;font-weight:500;margin:0 0 4.4cqw;opacity:.95}
.btn{display:inline-block;font-size:3.4cqw;font-weight:800;padding:2.2cqw 5cqw;border-radius:99cqw;background:#fff;color:#3b0a55}
.ph{display:inline-block;border:.35cqw dashed currentColor;border-radius:1.2cqw;padding:0 1.4cqw;font-size:.62em;vertical-align:.12em;line-height:1.5}
p .ph{font-size:.9em;vertical-align:0}
.items{position:absolute;left:7.4cqw;right:7.4cqw;bottom:7cqw;display:flex;flex-wrap:wrap;gap:1.6cqw}
.items span{font-size:3cqw;font-weight:700;padding:1.2cqw 2.8cqw;border-radius:99cqw;background:rgba(20,10,40,.72);color:#fff;backdrop-filter:blur(4px)}
.btop{position:absolute;left:7.4cqw;right:7.4cqw;top:9cqw;color:#fff}
.top{position:absolute;left:7.4cqw;right:7.4cqw;top:9cqw;font-size:6.4cqw;line-height:1.25;font-weight:900;letter-spacing:-.03em;color:#4a1f5c}
.tag{position:absolute;right:2.6cqw;bottom:2cqw;font-size:2cqw;color:rgba(255,255,255,.85);font-weight:600}
</style></head>
<body><div class="board">
<img class="bg" src="bg_1125_a.png" alt="">
<div class="shade"></div>
<div class="copy">
<div class="brand">컬리</div>
<div class="eyebrow">신선식품 새벽배송</div>
<h1>지금 담고<br>아침에 받기</h1>
<p>퇴근길에 장바구니만 채워 두세요.<br>아침이면 문 앞에 와 있어요.</p>
<span class="btn">장보기 시작하기 →</span>
</div>
<div class="items"><span>채소</span><span>과일</span><span>우유·달걀</span><span>저녁 반찬</span></div>
<div class="tag">수업용 시안</div>
</div></body></html>
