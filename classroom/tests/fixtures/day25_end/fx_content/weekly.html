<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>이번 주 바뀐 것</title>
<style>
:root{--bg:#f7f9fc;--fg:#1b2430;--card:#fff;--line:#d9e0ea;--accent:#0b5cd5;--muted:#566275;--warn:#fff3cd}
@media (prefers-color-scheme:dark){:root{--bg:#12171f;--fg:#e8edf4;--card:#1b222d;--line:#34404f;--accent:#7db3ff;--muted:#a3afc0;--warn:#4a3d10}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,"Noto Sans KR",sans-serif;line-height:1.55;overflow-wrap:anywhere}
.wrap{max-width:760px;margin:0 auto;padding:16px 16px 40px}
h1{font-size:20px;margin:0 0 4px}
h2{font-size:17px;margin:26px 0 8px;color:var(--accent)}
.sub{font-size:13px;color:var(--muted);margin:0 0 12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin:8px 0;font-size:14px}
.concl{background:var(--warn);border:2px solid var(--accent);font-size:15px;font-weight:600}
.card b{display:block;margin-bottom:2px}
.meta{font-size:12px;color:var(--muted)}
a{color:var(--accent)}
.btns{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
button{font:inherit;font-size:13px;padding:6px 10px;border:1px solid var(--accent);border-radius:16px;background:var(--card);color:var(--fg);cursor:pointer}
button[aria-pressed="true"]{background:var(--accent);color:var(--bg)}
.pill{display:inline-block;font-size:12px;border:1px solid var(--line);border-radius:10px;padding:0 8px;margin-right:6px}
table{border-collapse:collapse;width:100%;font-size:13px;table-layout:fixed}
th,td{padding:7px 6px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th:first-child{width:46%}
</style>
</head>
<body>
<div class="wrap">
<h1>이번 주 바뀐 것</h1>
<p class="sub">라네즈 수분 크림 · 경쟁 5곳 동향 · 조사일 2026-11-22 · 자료: research.csv, run_log.md</p>
<div class="card concl" id="concl">첫 조사라 비교는 다음 실행부터예요. 이번에 눈에 띄는 것: 이니스프리와 일리윤이 11/16에 홀리데이 에디션·멀티베리어 페이셜을 냈고, 에스트라는 11/04에 립 배리어 밤을 냈어요. (출처 링크는 아래 Top 5, 조사일 2026-11-22, 검색 요약)</div>

<h2>Top 5 바뀐 것</h2>
<div id="top5"></div>

<h2>전체 줄 표</h2>
<div class="btns" id="btns"></div>
<div id="rows"></div>

<h2>팩트체크 표</h2>
<table><thead><tr><th>확인</th><th>결과</th></tr></thead><tbody id="facts"></tbody></table>

<h2>자동 여부</h2>
<div class="card" id="auto"></div>
</div>
<script>
function main(){
  var DATA=[{"day": "2026-11-22", "who": "이니스프리", "kind": "신제품", "val": "2026 홀리데이 에디션 출시(11/16 매장·11/19 공식몰) / 소식 날짜 2026-11-16 (검색 요약)", "url": "https://www.specialtimes.co.kr/news/articleView.html?idxno=486366", "st": "NEW"}, {"day": "2026-11-22", "who": "이니스프리", "kind": "캠페인·프로모션", "val": "다마고치 에디션 11/5부터 공식몰 판매 / 소식 날짜 2026-11-05 (검색 요약)", "url": "https://www.specialtimes.co.kr/news/articleView.html?idxno=480842", "st": "NEW"}, {"day": "2026-11-22", "who": "이니스프리", "kind": "기사·보도자료", "val": "올리브영 올영픽 레티놀 앰플 더블 기획세트 / 소식 날짜 못 찾음(연도 미확인) (검색 요약)", "url": "https://www.specialtimes.co.kr/news/articleView.html?idxno=479612", "st": "NEW"}, {"day": "2026-11-22", "who": "에스트라", "kind": "신제품", "val": "아토베리어365 립 배리어 밤 출시(올리브영 먼저) / 소식 날짜 2026-11-04 (검색 요약)", "url": "https://www.apgroup.com/int/ko/news/2026-11-04-2.html", "st": "NEW"}, {"day": "2026-11-22", "who": "에스트라", "kind": "캠페인·프로모션", "val": "'진심은 피부로 느낀다' 캠페인 영상(아토베리어365 크림 누적 1000만 개 기념) / 소식 날짜 2026-02-24 (검색 요약) (30일 넘음)", "url": "https://www.twig24.com/news/2026/02/24/20260224500017", "st": "NEW"}, {"day": "2026-11-22", "who": "에스트라", "kind": "기사·보도자료", "val": "아토베리어365 하이드로 수딩크림·캡슐 토너 출시 / 소식 날짜 2026-05-21 (검색 요약) (30일 넘음)", "url": "https://www.apgroup.com/int/ko/news/2026-05-21-2.html", "st": "NEW"}, {"day": "2026-11-22", "who": "닥터지", "kind": "신제품", "val": "스킨부스트 PDRN 선세럼 올리브영 선론칭(변우석 모델 캠페인) / 소식 날짜 못 찾음 (검색 요약)", "url": "https://www.wikitree.co.kr/articles/1119844", "st": "NEW"}, {"day": "2026-11-22", "who": "닥터지", "kind": "캠페인·프로모션", "val": "일본 큐텐 메가와리 참여(11/21~12/3) / 소식 날짜 못 찾음(2025년 일정일 가능성) (검색 요약)", "url": "https://fashionbiz.co.kr/article/221500", "st": "NEW"}, {"day": "2026-11-22", "who": "닥터지", "kind": "기사·보도자료", "val": "못 찾음", "url": "못 찾음", "st": "NEW"}, {"day": "2026-11-22", "who": "일리윤", "kind": "신제품", "val": "멀티베리어 페이셜 라인 출시(올리브영, 덱스판테놀·식물성 PDRN 크림) / 소식 날짜 2026-11-16 (검색 요약)", "url": "https://www.apgroup.com/int/ko/news/2026-11-16-3.html", "st": "NEW"}, {"day": "2026-11-22", "who": "일리윤", "kind": "캠페인·프로모션", "val": "올리브영 '수분 매칭' 기획전(10/31~11/16) / 소식 날짜 2026-10-31 시작 (검색 요약)", "url": "https://global.oliveyoung.com/event/planning?plndpNo=3051", "st": "NEW"}, {"day": "2026-11-22", "who": "일리윤", "kind": "기사·보도자료", "val": "못 찾음", "url": "못 찾음", "st": "NEW"}, {"day": "2026-11-22", "who": "토리든", "kind": "신제품", "val": "다이브인 인텐시브 3종(판테놀 5%) 출시 / 소식 날짜 못 찾음 (검색 요약)", "url": "https://www.wikitree.co.kr/articles/1160956", "st": "NEW"}, {"day": "2026-11-22", "who": "토리든", "kind": "캠페인·프로모션", "val": "코르티스 '딥 다이브 뉴스' 캠페인 / 소식 날짜 2026-07-17 (검색 요약) (30일 넘음)", "url": "https://cosmorning.com/mobile/article.html?no=53119", "st": "NEW"}, {"day": "2026-11-22", "who": "토리든", "kind": "기사·보도자료", "val": "3분기 매출 47.1% 성장(분기 사상 최대) / 소식 날짜 못 찾음 (검색 요약)", "url": "https://www.wikitree.co.kr/articles/1175522", "st": "NEW"}];
  var LOG="2026-11-22 04:25 | 수동 1회 | 더한 줄 15 (NEW 15·바뀜 0·사라짐 0·확인 필요 0) | 못 찾음 2";
  var STATES=["NEW","바뀜","사라짐","같음","확인 필요"];
  function el(tag,cls,text){var e=document.createElement(tag);if(cls){e.className=cls;}if(text!==undefined){e.textContent=text;}return e;}
  function dateOf(v){var m=/소식 날짜 (\d{4}-\d{2}-\d{2})/.exec(v);return m?m[1]:"";}
  function link(u){
    if(/^https?:\/\//.test(u)){var a=el("a","","출처 링크");a.href=u;a.target="_blank";a.rel="noopener";return a;}
    return el("span","",u);
  }
  function card(r,prevText){
    var c=el("div","card");
    c.appendChild(el("b","",r.who+" · "+r.kind));
    c.appendChild(el("div","",r.val));
    if(prevText){c.appendChild(el("div","meta","이전 → 지금: "+prevText+" → "+r.st));}
    var m=el("div","meta","조사일 "+r.day+" · 상태 "+r.st+" · ");
    m.appendChild(link(r.url));
    c.appendChild(m);
    return c;
  }
  var cand=DATA.filter(function(r){
    var ok=r.st==="NEW"||r.st==="바뀜"||r.st==="사라짐";
    return ok&&r.val.indexOf("(30일 넘음)")<0&&dateOf(r.val)!=="";
  }).sort(function(a,b){return dateOf(b.val)<dateOf(a.val)?-1:1;}).slice(0,5);
  var t5=document.getElementById("top5");
  cand.forEach(function(r,i){
    var c=card(r,"첫 조사");
    c.firstChild.textContent=(i+1)+". "+r.who+" · "+r.kind;
    t5.appendChild(c);
  });
  if(cand.length===0){t5.appendChild(el("div","card","Top 5에 넣을 소식이 없어요."));}

  var box=document.getElementById("rows");
  var bar=document.getElementById("btns");
  function show(pick){
    box.textContent="";
    var n=0;
    DATA.forEach(function(r){if(pick==="전체"||r.st===pick){box.appendChild(card(r,""));n++;}});
    if(n===0){box.appendChild(el("div","card","이 상태의 줄이 없어요."));}
    Array.prototype.forEach.call(bar.children,function(b){b.setAttribute("aria-pressed",b.dataset.k===pick?"true":"false");});
  }
  ["전체"].concat(STATES).forEach(function(k){
    var cnt=DATA.filter(function(r){return k==="전체"||r.st===k;}).length;
    var b=el("button","",k+" "+cnt);
    b.type="button";b.dataset.k=k;
    b.addEventListener("click",function(){show(k);});
    bar.appendChild(b);
  });
  show("전체");

  var seen={},dup=0;
  DATA.forEach(function(r){var k=r.day+"|"+r.who+"|"+r.kind;if(seen[k]){dup++;}seen[k]=1;});
  var sc=STATES.map(function(s){return DATA.filter(function(r){return r.st===s;}).length;});
  var who={};DATA.forEach(function(r){who[r.who]=1;});
  var kinds={};DATA.forEach(function(r){kinds[r.kind]=1;});
  var nW=Object.keys(who).length,nK=Object.keys(kinds).length;
  var over=DATA.filter(function(r){return r.val.indexOf("(30일 넘음)")>=0;}).length;
  var nodate=DATA.filter(function(r){return r.val.indexOf("못 찾음")>=0&&r.val!=="못 찾음"&&dateOf(r.val)==="";}).length;
  var nf=DATA.filter(function(r){return r.val==="못 찾음";}).length;
  var recent=DATA.filter(function(r){return dateOf(r.val)!==""&&r.val.indexOf("(30일 넘음)")<0;}).length;
  var rows=[
    ["중복 줄 수 (같은 조사일·이름·항목)",dup+"줄"],
    ["전체 줄 다시 세기",STATES.map(function(s,i){return s+" "+sc[i];}).join(" + ")+" = "+sc.reduce(function(a,b){return a+b;},0)+" (표 줄 "+DATA.length+")"],
    ["이름×항목 곱",nW+"곳 × "+nK+"항목 = "+(nW*nK)+" (표 줄 "+DATA.length+")"],
    ["소식 날짜별 줄 수",recent+" (최근 30일) + "+over+" (30일 넘음) + "+nodate+" (날짜 못 찾음) + "+nf+" (소식 못 찾음) = "+(recent+over+nodate+nf)],
    ["지난번보다 크게 튄 숫자(두 배 넘게)","비교할 지난 조사가 없어 0건 (첫 조사)"],
    ["못 찾음 수",nf+"줄 (run_log.md의 못 찾음 2와 "+(nf===2?"같음":"다름")+")"],
    ["확인 필요 수",sc[4]+"줄"]
  ];
  var tb=document.getElementById("facts");
  rows.forEach(function(p){var tr=el("tr");tr.appendChild(el("td","",p[0]));tr.appendChild(el("td","",p[1]));tb.appendChild(tr);});
  document.getElementById("auto").textContent="수동 1회 실행(2026-11-22 04:25) · 자동 예약 없음. run_log.md: "+LOG;
}
main();
</script>
</body>
</html>
