<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>시안 A 라라스윗</title>
<style>
:root{--ink:#fff;--sub:rgba(255,255,255,.88);--btnbg:#fff;--btnfg:#3b2414;--fade:rgba(40,22,10,.82)}
html,body{margin:0;padding:0;background:#111;overflow:hidden}
body::-webkit-scrollbar{display:none}
.wrap{width:100%;max-width:1080px;margin:0 auto;container-type:inline-size}
.ad{position:relative;width:100cqw;height:125cqw;overflow:hidden;
 font-family:"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;word-break:keep-all;color:var(--ink)}
.ad{background:#000}
.ad img{position:absolute;left:0;top:0;top:0;width:100%;height:100%;object-fit:cover;object-position:center}
.grad{position:absolute;left:0;right:0;top:0;height:52%;
 background:linear-gradient(to bottom,var(--fade) 0%,var(--fade) 30%,transparent 100%)}
.txt{position:absolute;left:7cqw;right:7cqw;top:8cqw}
.brand.row{display:inline-block;margin:0 0 0 4cqw;vertical-align:middle;font-size:4cqw;color:var(--ink)}
.brand{font-size:3.4cqw;font-weight:800;letter-spacing:.06em;color:var(--sub);margin:0 0 2.6cqw}
h1{font-size:8.4cqw;line-height:1.18;font-weight:900;margin:0 0 2.6cqw;letter-spacing:-.02em}
p{font-size:3.7cqw;line-height:1.45;margin:0 0 4cqw;color:var(--sub);font-weight:500}
.btn{display:inline-block;background:var(--btnbg);color:var(--btnfg);font-size:3.6cqw;font-weight:800;
 padding:2.2cqw 5.4cqw;border-radius:99px}
.ph{display:inline-block;border:.45cqw dashed currentColor;border-radius:1.4cqw;padding:0 1.6cqw;line-height:1.15}
.ph.sm{border-width:.3cqw;padding:0 1cqw;font-size:3.2cqw}
.mark{position:absolute;right:2.6cqw;bottom:2.4cqw;font-size:2.3cqw;color:#fff;background:rgba(0,0,0,.45);
 padding:.6cqw 1.4cqw;border-radius:.8cqw;font-family:inherit}
</style></head>
<body><div class="wrap"><div class="ad">
<img src="bg_1125_a.png" alt="">
<div class="grad"></div>
<div class="txt">
<div class="brand">라라스윗</div>
<h1>숟가락이 멈칫하는<br>꾸덕함</h1>
<p>진하고 쫀득한 라라스윗 저당 아이스크림,<br>오늘 밤 한 스푼으로 느껴 보세요.</p>
<span class="btn">더 알아보기</span>
</div>
<div class="mark">수업용 시안</div>
</div></div></body></html>
